name: Verify official settlement forms
on:
  push:
    branches:
      - feature/settlement-forms-six-hwp-20261020
  pull_request:
    paths:
      - index.html
      - files/**
      - tests/check_settlement_forms.py
      - .github/workflows/verify-settlement-forms.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact original HWP bytes and download links
        run: python tests/check_settlement_forms.py
      - name: Check inline site JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', s)
          assert len(scripts)==1
          Path("/tmp/osan-site-inline.js").write_text(scripts[0],encoding="utf-8")
          PY
          node --check /tmp/osan-site-inline.js
